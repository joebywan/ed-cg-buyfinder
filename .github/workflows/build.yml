name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the suite
        # tkinter needs a display even to construct widgets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python test_cgbuy.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cgbuy-linux
            built: dist/cgbuy
          - os: windows-latest
            artifact: cgbuy-windows.exe
            built: dist/cgbuy.exe
    runs-on: ${{ matrix.os }}
    # Mapped to job-level env so the signing step can test for them: the
    # secrets context is not available in a step-level `if`. Absent (forks,
    # or before a certificate exists) the signing step simply skips.
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux tkinter
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
      - name: Install PyInstaller
        run: python -m pip install --quiet --upgrade pip pyinstaller
      # PyInstaller cannot cross-compile, which is the whole reason for the
      # matrix: each binary is built on the OS it targets.
      #
      # --windowed matches build.bat: without it the Windows build is a console
      # subsystem binary and every user gets a stray console window behind the
      # GUI. It is ignored on Linux.
      - name: Build
        shell: bash
        run: |
          python -c "import shutil; shutil.copy('cgbuy', 'build_src.py')"
          pyinstaller --onefile --name cgbuy --clean --noconfirm --windowed --distpath dist --workpath .build --specpath .build build_src.py
      - name: Sign the Windows binary
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cgbuy-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found on this runner' }
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 '${{ matrix.built }}'
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
            & $signtool.FullName verify /pa '${{ matrix.built }}'
            if ($LASTEXITCODE -ne 0) { throw "the signature did not verify ($LASTEXITCODE)" }
          } finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }
      - name: Smoke test
        shell: bash
        run: |
          test -f "${{ matrix.built }}" || { echo "binary missing"; exit 1; }
          # --windowed leaves the Windows build without a console of its own.
          # Its stdout is a valid handle here only because this capture pipes
          # it; assert non-empty so a swallowed --version fails loudly rather
          # than passing silently.
          OUT=$("${{ matrix.built }}" --version)
          echo "$OUT"
          [ -n "$OUT" ] || { echo "::error::--version printed nothing (windowed build has no stdout?)"; exit 1; }
      - name: Rename
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  snapshot:
    # Every push to main refreshes a single rolling pre-release, so there is
    # always a current build to download without minting version numbers.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Move the snapshot tag to this commit
        run: |
          git tag -f snapshot
          git push -f origin snapshot
      # Written here rather than inline below so the signing line states what
      # this build actually did, instead of a claim that goes stale the day a
      # certificate is added.
      - name: Compose the release notes
        shell: bash
        env:
          SIGNED: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          {
            echo 'Rolling build of `main` — replaced on every push, not a stable version.'
            echo
            echo 'Commit `${{ github.sha }}`'
            echo
            echo '* `cgbuy-linux` — Linux x86-64'
            echo '* `cgbuy-windows.exe` — Windows x86-64'
            echo
            if [ "$SIGNED" = "true" ]; then
              echo 'The Windows binary is Authenticode-signed.'
            else
              echo 'Neither binary is signed; Windows SmartScreen will warn on first run.'
            fi
            echo
            echo 'Some antivirus engines flag PyInstaller one-file builds generically.'
            echo 'See [Antivirus false positives](../../#antivirus-false-positives).'
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: "Snapshot (latest main)"
          prerelease: true
          body_path: notes.md
          files: |
            cgbuy-linux
            cgbuy-windows.exe
