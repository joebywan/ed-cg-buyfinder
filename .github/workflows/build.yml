name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the suite
        # tkinter needs a display even to construct widgets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python test_cgbuy.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # The snapshot tag is reused on every push, so its assets carry the
            # commit instead of a version: downloading two of them in a row
            # gives two distinct files, not cgbuy-linux(1).
            suffix: linux
            built: dist/cgbuy
            icon: ""
          - os: windows-latest
            suffix: windows.exe
            built: dist/cgbuy.exe
            icon: "icon.ico"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux tkinter
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
      - name: Install PyInstaller
        run: python -m pip install --quiet --upgrade pip pyinstaller
      # PyInstaller cannot cross-compile, which is the whole reason for the
      # matrix: each binary is built on the OS it targets.
      #
      # --windowed matches build.bat: without it the Windows build is a console
      # subsystem binary and every user gets a stray console window behind the
      # GUI. It is ignored on Linux.
      - name: Build
        shell: bash
        run: |
          python -c "import shutil; shutil.copy('cgbuy', 'build_src.py')"
          # PyInstaller resolves a relative --icon against --specpath, not the
          # working directory, so hand it an absolute path.
          ICON_FLAG=""
          if [ -n "${{ matrix.icon }}" ]; then
            ICON_FLAG="--icon=$(python -c "import os,sys; print(os.path.abspath(sys.argv[1]))" "${{ matrix.icon }}")"
          fi
          # PyInstaller bundles what cgbuy imports, not files a module opens:
          # without this sco_table.json is missing and every hull reads as
          # an estimate. Absolute for the same --specpath reason as the icon;
          # os.pathsep because a Windows path already contains a colon.
          DATA_FLAG="--add-data=$(python -c "import os; print(os.path.abspath('sco_table.json') + os.pathsep + '.')")"
          pyinstaller --onefile --name cgbuy --clean --noconfirm --windowed $ICON_FLAG $DATA_FLAG --distpath dist --workpath .build --specpath .build build_src.py
      - name: Smoke test
        shell: bash
        run: |
          test -f "${{ matrix.built }}" || { echo "binary missing"; exit 1; }
          # --windowed leaves the Windows build without a console of its own.
          # Its stdout is a valid handle here only because this capture pipes
          # it; assert non-empty so a swallowed --version fails loudly rather
          # than passing silently.
          OUT=$("${{ matrix.built }}" --version)
          echo "$OUT"
          [ -n "$OUT" ] || { echo "::error::--version printed nothing (windowed build has no stdout?)"; exit 1; }
      - name: Name the binary after the commit
        shell: bash
        run: |
          echo "ASSET=cgbuy-$(echo "${{ github.sha }}" | cut -c1-7)-${{ matrix.suffix }}" >> "$GITHUB_ENV"
      - name: Rename
        shell: bash
        run: mv "${{ matrix.built }}" "$ASSET"
      # A GitHub release asset carries no POSIX mode: the execute bit is lost
      # on upload and again on download, so the raw binary always needs a
      # chmod. tar does store the mode, so ship a tarball as well and the
      # extracted binary is runnable straight away.
      - name: Tarball the Linux binary, execute bit intact
        if: runner.os == 'Linux'
        run: |
          chmod +x "$ASSET"
          tar -czf "$ASSET.tar.gz" "$ASSET"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}*

  snapshot:
    # Every push to main refreshes a single rolling pre-release, so there is
    # always a current build to download without minting version numbers.
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Move the snapshot tag to this commit
        run: |
          git tag -f snapshot
          git push -f origin snapshot
      - name: Work out this commit's asset names
        run: echo "SHORT=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_ENV"
      # The snapshot tag is reused but its asset names now change with every
      # commit, so same-name replacement no longer clears the old build: strip
      # the release back to empty first or the downloads list grows forever.
      - name: Clear the previous snapshot's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view snapshot --json assets --jq '.assets[].name' 2>/dev/null) || exit 0
          for a in $names; do gh release delete-asset snapshot "$a" -y; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: "Snapshot (latest main)"
          prerelease: true
          body: |
            Rolling build of `main` — replaced on every push, not a stable version.

            Commit `${{ github.sha }}`

            * `cgbuy-${{ env.SHORT }}-linux.tar.gz` — Linux x86-64, extracts ready to run
            * `cgbuy-${{ env.SHORT }}-linux` — the same binary, unpacked (needs `chmod +x`)
            * `cgbuy-${{ env.SHORT }}-windows.exe` — Windows x86-64

            Neither binary is signed and neither will be; Windows SmartScreen
            will warn on first run. Some antivirus engines flag PyInstaller
            one-file builds generically — see
            [Antivirus false positives](../../#antivirus-false-positives),
            or run from source: `python cgbuy`.
          files: |
            cgbuy-${{ env.SHORT }}-linux
            cgbuy-${{ env.SHORT }}-linux.tar.gz
            cgbuy-${{ env.SHORT }}-windows.exe
