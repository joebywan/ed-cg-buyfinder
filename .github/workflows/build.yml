name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the suite
        # tkinter needs a display even to construct widgets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python test_cgbuy.py

  # Linux and Windows no longer share a build; see the comment in release.yml
  # for why the Windows side is compiled with Nuitka into a folder instead of
  # packed into a single self-extracting exe.
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
      - name: Install PyInstaller
        run: python -m pip install --quiet --upgrade pip pyinstaller
      - name: Build
        run: |
          python -c "import shutil; shutil.copy('cgbuy', 'build_src.py')"
          # PyInstaller bundles what cgbuy imports, not files a module opens:
          # without this sco_table.json is missing and every hull reads as an
          # estimate. Absolute because PyInstaller resolves relative paths
          # against --specpath, not the working directory.
          DATA_FLAG="--add-data=$(python -c "import os; print(os.path.abspath('sco_table.json') + os.pathsep + '.')")"
          pyinstaller --onefile --name cgbuy --clean --noconfirm --windowed $DATA_FLAG \
            --distpath dist --workpath .build --specpath .build build_src.py
      - name: Smoke test
        run: |
          OUT=$(dist/cgbuy --version)
          echo "$OUT"
          [ -n "$OUT" ] || { echo "::error::--version printed nothing"; exit 1; }
      - name: Package
        run: |
          BIN="cgbuy-$(echo "${{ github.sha }}" | cut -c1-7)-linux"
          mv dist/cgbuy "$BIN"
          chmod +x "$BIN"
          tar -czf "$BIN.tar.gz" "$BIN"
          echo "ASSET=$BIN" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}*

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Nuitka
        run: python -m pip install --quiet --upgrade pip nuitka
      - name: Build
        shell: bash
        run: |
          python -c "import shutil; shutil.copy('cgbuy', 'build_src.py')"
          python -m nuitka --standalone --assume-yes-for-downloads \
            --enable-plugin=tk-inter --windows-console-mode=disable \
            --windows-icon-from-ico=icon.ico \
            --include-data-files=sco_table.json=sco_table.json \
            --output-dir=nuitka --output-filename=cgbuy.exe build_src.py
      - name: Smoke test
        shell: bash
        run: |
          OUT=$(nuitka/build_src.dist/cgbuy.exe --version)
          echo "$OUT"
          [ -n "$OUT" ] || { echo "::error::--version printed nothing"; exit 1; }
      - name: Package
        shell: bash
        run: |
          DIR="cgbuy-$(echo "${{ github.sha }}" | cut -c1-7)-windows"
          mv nuitka/build_src.dist "$DIR"
          # Notepad is the default handler and the .gitattributes eol=crlf rule
          # cannot be trusted to have survived checkout, so force CRLF here
          # rather than shipping a file that opens as one long line. The \r*
          # makes it idempotent whichever way the checkout landed.
          sed "s/@VERSION@/$(echo "${{ github.sha }}" | cut -c1-7)/" packaging/README-FIRST.txt \
            | sed 's/\r*$/\r/' > "$DIR/README-FIRST.txt"
          7z a -tzip -mx=9 "$DIR.zip" "$DIR" > /dev/null
          echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  snapshot:
    # Every push to main refreshes a single rolling pre-release, so there is
    # always a current build to download without minting version numbers.
    needs: [build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Move the snapshot tag to this commit
        run: |
          git tag -f snapshot
          git push -f origin snapshot
      - name: Work out this commit's asset names
        run: echo "SHORT=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_ENV"
      # The snapshot tag is reused but its asset names now change with every
      # commit, so same-name replacement no longer clears the old build: strip
      # the release back to empty first or the downloads list grows forever.
      - name: Clear the previous snapshot's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view snapshot --json assets --jq '.assets[].name' 2>/dev/null) || exit 0
          for a in $names; do gh release delete-asset snapshot "$a" -y; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: "Snapshot (latest main)"
          prerelease: true
          body: |
            Rolling build of `main` — replaced on every push, not a stable version.

            Commit `${{ github.sha }}`

            * `cgbuy-${{ env.SHORT }}-windows.zip` — Windows x86-64, extract the folder and run `cgbuy.exe`
            * `cgbuy-${{ env.SHORT }}-linux.tar.gz` — Linux x86-64, extracts ready to run
            * `cgbuy-${{ env.SHORT }}-linux` — the same binary, loose (needs `chmod +x`)

            Neither binary is signed and neither will be; Windows SmartScreen
            will warn on first run. The Windows build ships as a folder because
            the self-extracting one-file format was what engines flagged — see
            [Antivirus false positives](../../#antivirus-false-positives),
            or run from source: `python cgbuy`.
          files: |
            cgbuy-${{ env.SHORT }}-windows.zip
            cgbuy-${{ env.SHORT }}-linux
            cgbuy-${{ env.SHORT }}-linux.tar.gz
