name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The app is a Tauri webview shell around app/, so these jobs need a Rust
  # toolchain and, on Linux, WebKitGTK to link against.
  #
  # Why `cargo tauri build` and not tauri-apps/tauri-action: that action wants
  # to create the release and upload the bundles itself, under Tauri's own
  # file names. Here the tag job, the artifact hand-off, the renaming and the
  # VirusTotal step already exist and own all of that, so we only need the
  # builder, and the CLI is one cached `cargo install` away.
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      # Caches target/ and ~/.cargo/bin, which is what makes the cargo install
      # below a no-op on every run after the first. Keep it ahead of that step.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install tauri-cli
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - name: Web tests, and the version stamps must agree with VERSION
        working-directory: app
        run: |
          npm test
          node stamp-version.mjs --check
      # cargo test compiles the app, and the app embeds dist/, which only
      # exists once prep.mjs has copied the web files into it.
      - name: Rust tests
        working-directory: app/src-tauri
        run: |
          node prep.mjs
          cargo test
      # AppImage and deb only: the default "all" would also try rpm.
      - name: Build
        working-directory: app
        run: cargo tauri build --bundles appimage,deb
      # The raw binary links WebKitGTK dynamically, so it only runs where
      # libwebkit2gtk-4.1 is installed; the AppImage carries its own copy and
      # the deb declares the dependency. None of these keep the execute bit
      # through a release upload, hence the chmod note in the release text.
      - name: Package
        run: |
          B=app/src-tauri/target/release
          PFX="ed-cg-buyfinder-$(echo "${{ github.sha }}" | cut -c1-7)"
          cp "$B/ed-cg-buyfinder" "$PFX-linux"
          chmod +x "$PFX-linux"
          cp "$B"/bundle/appimage/*.AppImage "$PFX-linux.AppImage"
          cp "$B"/bundle/deb/*.deb "$PFX-linux.deb"
          ls -lh "$PFX"-linux*
      - uses: actions/upload-artifact@v4
        with:
          name: ed-cg-buyfinder-linux
          path: ed-cg-buyfinder-*-linux*

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install tauri-cli
        shell: bash
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - name: Web tests, and the version stamps must agree with VERSION
        shell: bash
        working-directory: app
        run: |
          npm test
          node stamp-version.mjs --check
      # No installer: the NSIS setup.exe drew 3/75 heuristic VirusTotal hits
      # (APEX, Cylance, DeepInstinct - common for unsigned installers) while
      # the same exe zipped scored 0/75, so only the portable zip ships.
      - name: Build
        shell: bash
        working-directory: app
        run: cargo tauri build --no-bundle
      # The portable zip is the bare release exe plus a README-FIRST.txt; WebView2
      # ships with Windows 10/11 so a lone exe is enough on any current machine,
      # and the README says what to do on one that lacks it.
      - name: Package
        shell: bash
        run: |
          B=app/src-tauri/target/release
          PFX="ed-cg-buyfinder-$(echo "${{ github.sha }}" | cut -c1-7)"
          DIR="$PFX-windows"
          mkdir "$DIR"
          cp "$B/ed-cg-buyfinder.exe" "$DIR/ed-cg-buyfinder.exe"
          # Notepad is the default handler and the .gitattributes eol=crlf rule
          # cannot be trusted to have survived checkout, so force CRLF here
          # (the \r* makes it idempotent whichever way the checkout landed).
          sed "s/@VERSION@/$(echo "${{ github.sha }}" | cut -c1-7)/" packaging/README-FIRST.txt \
            | sed 's/\r*$/\r/' > "$DIR/README-FIRST.txt"
          7z a -tzip -mx=9 "$DIR.zip" "$DIR" > /dev/null
          ls -lh "$DIR.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ed-cg-buyfinder-windows
          path: |
            ed-cg-buyfinder-*-windows.zip

  # Preview of the VirusTotal verdict for the Windows zip, so a
  # change that makes engines unhappy shows up on the PR instead of only after
  # a release. release.yml still does the real scan; this one never writes the
  # README badge (no --badge), only the job summary.
  #
  # Skipped, not failed, when there is no key: secrets are not passed to PRs
  # from forks. It also spends quota (free key: 500 requests/day), hence PRs and
  # manual runs only, not every push to main.
  virustotal-preview:
    needs: build-windows
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      VT_API_KEY: ${{ secrets.VT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        if: env.VT_API_KEY != ''
      - uses: actions/download-artifact@v4
        if: env.VT_API_KEY != ''
        with: { name: ed-cg-buyfinder-windows }
      - name: Scan and write the result to the job summary
        if: env.VT_API_KEY != ''
        # tee: the table goes to the run summary AND the job log, so it can be
        # read with `gh run view --log` as well as on the run page.
        run: python .github/scripts/vt_scan.py --when="for this pull request build" ed-cg-buyfinder-*-windows.zip | tee -a "$GITHUB_STEP_SUMMARY"
      - name: No VT_API_KEY here
        if: env.VT_API_KEY == ''
        run: echo "VT_API_KEY is not available (fork PR?), skipping the VirusTotal preview." >> "$GITHUB_STEP_SUMMARY"

  snapshot:
    # Every push to main refreshes a single rolling pre-release, so there is
    # always a current build to download without minting version numbers.
    needs: [build-linux, build-windows, build-linux, build-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Move the snapshot tag to this commit
        run: |
          git tag -f snapshot
          git push -f origin snapshot
      - name: Work out this commit's asset names
        run: echo "SHORT=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_ENV"
      # The snapshot tag is reused but its asset names now change with every
      # commit, so same-name replacement no longer clears the old build: strip
      # the release back to empty first or the downloads list grows forever.
      - name: Clear the previous snapshot's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view snapshot --json assets --jq '.assets[].name' 2>/dev/null) || exit 0
          for a in $names; do gh release delete-asset snapshot "$a" -y; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: "Snapshot (latest main)"
          prerelease: true
          body: |
            Rolling build of `main` — replaced on every push, not a stable version.

            Commit `${{ github.sha }}`

            * `ed-cg-buyfinder-${{ env.SHORT }}-windows.zip` — Windows x86-64, extract the folder and run `ed-cg-buyfinder.exe` (needs WebView2, which Windows 10/11 include)
            * `ed-cg-buyfinder-${{ env.SHORT }}-linux.AppImage` — Linux x86-64 (needs `chmod +x`)
            * `ed-cg-buyfinder-${{ env.SHORT }}-linux.deb` — Debian/Ubuntu package
            * `ed-cg-buyfinder-${{ env.SHORT }}-linux` — the bare binary (needs `chmod +x` and libwebkit2gtk-4.1)

            Nothing here is signed; Windows SmartScreen will warn on first run.
            See [Antivirus](../../#antivirus).
          files: |
            ed-cg-buyfinder-${{ env.SHORT }}-windows.zip
            ed-cg-buyfinder-${{ env.SHORT }}-linux.AppImage
            ed-cg-buyfinder-${{ env.SHORT }}-linux.deb
            ed-cg-buyfinder-${{ env.SHORT }}-linux
