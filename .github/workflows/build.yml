name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the suite
        # tkinter needs a display even to construct widgets
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python test_cgbuy.py

  # Linux and Windows no longer share a build; see the comment in release.yml
  # for why the Windows side is compiled with Nuitka into a folder instead of
  # packed into a single self-extracting exe.
  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
      - name: Install PyInstaller
        run: python -m pip install --quiet --upgrade pip pyinstaller
      - name: Build
        run: |
          python -c "import shutil; shutil.copy('cgbuy', 'build_src.py')"
          pyinstaller --onefile --name cgbuy --clean --noconfirm --windowed \
            --distpath dist --workpath .build --specpath .build build_src.py
      - name: Smoke test
        run: |
          OUT=$(dist/cgbuy --version)
          echo "$OUT"
          [ -n "$OUT" ] || { echo "::error::--version printed nothing"; exit 1; }
      - name: Package
        run: |
          BIN="cgbuy-$(echo "${{ github.sha }}" | cut -c1-7)-linux"
          mv dist/cgbuy "$BIN"
          chmod +x "$BIN"
          tar -czf "$BIN.tar.gz" "$BIN"
          echo "ASSET=$BIN" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}*

  build-windows:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Nuitka
        run: python -m pip install --quiet --upgrade pip nuitka
      - name: Build
        shell: bash
        run: |
          python -c "import shutil; shutil.copy('cgbuy', 'build_src.py')"
          python -m nuitka --standalone --assume-yes-for-downloads \
            --enable-plugin=tk-inter --windows-console-mode=disable \
            --windows-icon-from-ico=icon.ico \
            --output-dir=nuitka --output-filename=cgbuy.exe build_src.py
      - name: Smoke test
        shell: bash
        run: |
          OUT=$(nuitka/build_src.dist/cgbuy.exe --version)
          echo "$OUT"
          [ -n "$OUT" ] || { echo "::error::--version printed nothing"; exit 1; }
      - name: Package
        shell: bash
        run: |
          DIR="cgbuy-$(echo "${{ github.sha }}" | cut -c1-7)-windows"
          mv nuitka/build_src.dist "$DIR"
          # Notepad is the default handler and the .gitattributes eol=crlf rule
          # cannot be trusted to have survived checkout, so force CRLF here
          # rather than shipping a file that opens as one long line. The \r*
          # makes it idempotent whichever way the checkout landed.
          sed "s/@VERSION@/$(echo "${{ github.sha }}" | cut -c1-7)/" packaging/README-FIRST.txt \
            | sed 's/\r*$/\r/' > "$DIR/README-FIRST.txt"
          7z a -tzip -mx=9 "$DIR.zip" "$DIR" > /dev/null
          echo "ASSET=$DIR.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  # The Tauri rewrite of the app, built alongside the Python one above and
  # shipped under cgbuy-desktop-* names so the two never collide. It is a
  # webview shell around app/, so unlike the Python jobs these need a Rust
  # toolchain and, on Linux, WebKitGTK to link against.
  #
  # Why `cargo tauri build` and not tauri-apps/tauri-action: that action wants
  # to create the release and upload the bundles itself, under Tauri's own
  # file names. Here the tag job, the artifact hand-off, the renaming and the
  # VirusTotal step already exist and own all of that, so we only need the
  # builder, and the CLI is one cached `cargo install` away.
  build-desktop-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      # Caches target/ and ~/.cargo/bin, which is what makes the cargo install
      # below a no-op on every run after the first. Keep it ahead of that step.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install tauri-cli
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - name: Web tests, and the version stamps must agree with version.py
        working-directory: app
        run: |
          npm test
          node stamp-version.mjs --check
      # cargo test compiles the app, and the app embeds dist/, which only
      # exists once prep.mjs has copied the web files into it.
      - name: Rust tests
        working-directory: app/src-tauri
        run: |
          node prep.mjs
          cargo test
      # AppImage and deb only: the default "all" would also try rpm.
      - name: Build
        working-directory: app
        run: cargo tauri build --bundles appimage,deb
      # The raw binary links WebKitGTK dynamically, so it only runs where
      # libwebkit2gtk-4.1 is installed; the AppImage carries its own copy and
      # the deb declares the dependency. Like the Python binary, none of these
      # keep the execute bit through a release upload, hence the chmod note in
      # the release text.
      - name: Package
        run: |
          B=app/src-tauri/target/release
          PFX="cgbuy-desktop-$(echo "${{ github.sha }}" | cut -c1-7)"
          cp "$B/cgbuy" "$PFX-linux"
          chmod +x "$PFX-linux"
          cp "$B"/bundle/appimage/*.AppImage "$PFX-linux.AppImage"
          cp "$B"/bundle/deb/*.deb "$PFX-linux.deb"
          ls -lh "$PFX"-linux*
      - uses: actions/upload-artifact@v4
        with:
          name: cgbuy-desktop-linux
          path: cgbuy-desktop-*-linux*

  build-desktop-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install tauri-cli
        shell: bash
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - name: Web tests, and the version stamps must agree with version.py
        shell: bash
        working-directory: app
        run: |
          npm test
          node stamp-version.mjs --check
      # NSIS only: the default "all" would also build an .msi, which needs a
      # WiX download and is a second installer nobody asked for.
      - name: Build
        shell: bash
        working-directory: app
        run: cargo tauri build --bundles nsis
      # Two downloads from one build. The setup.exe is Tauri's NSIS installer
      # (it fetches WebView2 itself if missing). The portable zip is the bare
      # release exe plus a README-FIRST.txt; WebView2 ships with Windows 10/11
      # so a lone exe is enough on any current machine, and the README says
      # what to do on one that lacks it. Unlike the Python build there are no
      # DLLs beside the exe, so the zip really is one file plus the note.
      - name: Package
        shell: bash
        run: |
          B=app/src-tauri/target/release
          PFX="cgbuy-desktop-$(echo "${{ github.sha }}" | cut -c1-7)"
          cp "$B"/bundle/nsis/*-setup.exe "$PFX-windows-setup.exe"
          DIR="$PFX-windows-portable"
          mkdir "$DIR"
          cp "$B/cgbuy.exe" "$DIR/cgbuy.exe"
          # Same CRLF handling as the Python package step, for the same reason.
          sed "s/@VERSION@/$(echo "${{ github.sha }}" | cut -c1-7)/" packaging/README-FIRST-desktop.txt \
            | sed 's/\r*$/\r/' > "$DIR/README-FIRST.txt"
          7z a -tzip -mx=9 "$DIR.zip" "$DIR" > /dev/null
          ls -lh "$PFX"-windows*
      - uses: actions/upload-artifact@v4
        with:
          name: cgbuy-desktop-windows
          path: |
            cgbuy-desktop-*-windows-setup.exe
            cgbuy-desktop-*-windows-portable.zip

  snapshot:
    # Every push to main refreshes a single rolling pre-release, so there is
    # always a current build to download without minting version numbers.
    needs: [build-linux, build-windows, build-desktop-linux, build-desktop-windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Move the snapshot tag to this commit
        run: |
          git tag -f snapshot
          git push -f origin snapshot
      - name: Work out this commit's asset names
        run: echo "SHORT=$(echo "${{ github.sha }}" | cut -c1-7)" >> "$GITHUB_ENV"
      # The snapshot tag is reused but its asset names now change with every
      # commit, so same-name replacement no longer clears the old build: strip
      # the release back to empty first or the downloads list grows forever.
      - name: Clear the previous snapshot's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names=$(gh release view snapshot --json assets --jq '.assets[].name' 2>/dev/null) || exit 0
          for a in $names; do gh release delete-asset snapshot "$a" -y; done
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: snapshot
          name: "Snapshot (latest main)"
          prerelease: true
          body: |
            Rolling build of `main` — replaced on every push, not a stable version.

            Commit `${{ github.sha }}`

            * `cgbuy-${{ env.SHORT }}-windows.zip` — Windows x86-64, extract the folder and run `cgbuy.exe`
            * `cgbuy-${{ env.SHORT }}-linux.tar.gz` — Linux x86-64, extracts ready to run
            * `cgbuy-${{ env.SHORT }}-linux` — the same binary, loose (needs `chmod +x`)

            The new Tauri desktop build (work in progress; the Python one above
            is still the main download):

            * `cgbuy-desktop-${{ env.SHORT }}-windows-setup.exe` — Windows installer
            * `cgbuy-desktop-${{ env.SHORT }}-windows-portable.zip` — Windows, a single `cgbuy.exe`, no install
            * `cgbuy-desktop-${{ env.SHORT }}-linux.AppImage` — Linux x86-64 (needs `chmod +x`)
            * `cgbuy-desktop-${{ env.SHORT }}-linux.deb` — Debian/Ubuntu package
            * `cgbuy-desktop-${{ env.SHORT }}-linux` — the bare binary (needs `chmod +x` and libwebkit2gtk-4.1)

            Neither Python binary is signed and neither will be; Windows SmartScreen
            will warn on first run. The Windows build ships as a folder because
            the self-extracting one-file format was what engines flagged — see
            [Antivirus](../../#antivirus),
            or run from source: `python cgbuy`.
          files: |
            cgbuy-${{ env.SHORT }}-windows.zip
            cgbuy-${{ env.SHORT }}-linux
            cgbuy-${{ env.SHORT }}-linux.tar.gz
            cgbuy-desktop-${{ env.SHORT }}-windows-setup.exe
            cgbuy-desktop-${{ env.SHORT }}-windows-portable.zip
            cgbuy-desktop-${{ env.SHORT }}-linux.AppImage
            cgbuy-desktop-${{ env.SHORT }}-linux.deb
            cgbuy-desktop-${{ env.SHORT }}-linux
