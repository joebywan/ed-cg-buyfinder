name: release

# Run this by hand: Actions -> release -> Run workflow, and give it a version.
# It bumps the version in the source, tags it, builds the desktop app for
# Windows and Linux and publishes them as a proper (non-pre) release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 2.2 (no leading v)"
        required: true
      notes:
        description: "Extra release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Validate and check the tag is free
        id: check
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            || { echo "::error::version must look like 2.2 or 2.2.1, got '$V'"; exit 1; }
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::tag v$V already exists"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Tests must pass before anything is tagged
        run: (cd app && npm test)

      # VERSION is the only place the number is typed. stamp-version.mjs copies
      # it into src/version.js (what EDDN records), tauri.conf.json, Cargo.toml
      # and Cargo.lock, and --check fails the job if any was missed.
      - name: Bump VERSION in the source and tag it
        run: |
          V="${{ steps.check.outputs.version }}"
          echo "$V" > VERSION
          node app/stamp-version.mjs
          node app/stamp-version.mjs --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$V"
          git tag "v$V"
          git push origin HEAD:main
          git push origin "v$V"

  # The app is a Tauri webview shell around app/, so these jobs need a Rust
  # toolchain and, on Linux, WebKitGTK to link against.
  #
  # Why `cargo tauri build` and not tauri-apps/tauri-action: that action wants
  # to create the release and upload the bundles itself, under Tauri's own
  # file names. Here the tag job, the artifact hand-off, the renaming and the
  # VirusTotal step already exist and own all of that, so we only need the
  # builder, and the CLI is one cached `cargo install` away.
  build-linux:
    needs: tag
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the Tauri system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      # Caches target/ and ~/.cargo/bin, which is what makes the cargo install
      # below a no-op on every run after the first. Keep it ahead of that step.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install tauri-cli
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - name: Web tests, and the version stamps must agree with VERSION
        working-directory: app
        run: |
          npm test
          node stamp-version.mjs --check
      # cargo test compiles the app, and the app embeds dist/, which only
      # exists once prep.mjs has copied the web files into it.
      - name: Rust tests
        working-directory: app/src-tauri
        run: |
          node prep.mjs
          cargo test
      # AppImage and deb only: the default "all" would also try rpm.
      - name: Build
        working-directory: app
        run: cargo tauri build --bundles appimage,deb
      # The raw binary links WebKitGTK dynamically, so it only runs where
      # libwebkit2gtk-4.1 is installed; the AppImage carries its own copy and
      # the deb declares the dependency. None of these keep the execute bit
      # through a release upload, hence the chmod note in the release text.
      - name: Package
        run: |
          B=app/src-tauri/target/release
          PFX="cgbuy-v${{ needs.tag.outputs.version }}"
          cp "$B/cgbuy" "$PFX-linux"
          chmod +x "$PFX-linux"
          cp "$B"/bundle/appimage/*.AppImage "$PFX-linux.AppImage"
          cp "$B"/bundle/deb/*.deb "$PFX-linux.deb"
          ls -lh "$PFX"-linux*
      - uses: actions/upload-artifact@v4
        with:
          name: cgbuy-linux
          path: cgbuy-v*-linux*

  build-windows:
    needs: tag
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Install tauri-cli
        shell: bash
        run: command -v cargo-tauri || cargo install tauri-cli --version "^2" --locked
      - name: Web tests, and the version stamps must agree with VERSION
        shell: bash
        working-directory: app
        run: |
          npm test
          node stamp-version.mjs --check
      # No installer: the NSIS setup.exe drew 3/75 heuristic VirusTotal hits
      # (APEX, Cylance, DeepInstinct - common for unsigned installers) while
      # the same exe zipped scored 0/75, so only the portable zip ships.
      - name: Build
        shell: bash
        working-directory: app
        run: cargo tauri build --no-bundle
      # The portable zip is the bare release exe plus a README-FIRST.txt; WebView2
      # ships with Windows 10/11 so a lone exe is enough on any current machine,
      # and the README says what to do on one that lacks it.
      - name: Package
        shell: bash
        run: |
          B=app/src-tauri/target/release
          PFX="cgbuy-v${{ needs.tag.outputs.version }}"
          DIR="$PFX-windows"
          mkdir "$DIR"
          cp "$B/cgbuy.exe" "$DIR/cgbuy.exe"
          # Notepad is the default handler and the .gitattributes eol=crlf rule
          # cannot be trusted to have survived checkout, so force CRLF here
          # (the \r* makes it idempotent whichever way the checkout landed).
          sed "s/@VERSION@/v${{ needs.tag.outputs.version }}/" packaging/README-FIRST.txt \
            | sed 's/\r*$/\r/' > "$DIR/README-FIRST.txt"
          7z a -tzip -mx=9 "$DIR.zip" "$DIR" > /dev/null
          ls -lh "$DIR.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: cgbuy-windows
          path: cgbuy-v*-windows.zip

  publish:
    needs: [tag, build-linux, build-windows, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          name: v${{ needs.tag.outputs.version }}
          generate_release_notes: true
          body: |
            ${{ inputs.notes }}

            cgbuy is now a new app (a web UI in a native window, also available
            as a website) replacing the old Python one. Your settings carry
            over: it reads the old `cgbuy.json` on first run. The old app's
            update check only opens this page, so just download the new one.

            * `cgbuy-v${{ needs.tag.outputs.version }}-windows.zip` — Windows x86-64, a folder with a
              single `cgbuy.exe` and a `README-FIRST.txt`; extract it and run
              the exe. Needs the WebView2 runtime, which Windows 10/11 already have
            * `cgbuy-v${{ needs.tag.outputs.version }}-linux.AppImage` — Linux x86-64 (needs `chmod +x`)
            * `cgbuy-v${{ needs.tag.outputs.version }}-linux.deb` — Debian/Ubuntu package
            * `cgbuy-v${{ needs.tag.outputs.version }}-linux` — the bare binary (needs `chmod +x` and libwebkit2gtk-4.1)

            Nothing here is signed and nothing will be; Windows SmartScreen
            will warn on first run — see [Antivirus](../../#antivirus).
            No install at all: https://knowhowit.com.au/ed-cg-buyfinder/
          files: |
            cgbuy-v${{ needs.tag.outputs.version }}-windows.zip
            cgbuy-v${{ needs.tag.outputs.version }}-linux.AppImage
            cgbuy-v${{ needs.tag.outputs.version }}-linux.deb
            cgbuy-v${{ needs.tag.outputs.version }}-linux

  virustotal:
    # Scans what was actually published and appends the verdict to the release,
    # so anyone who is forwarded a scary-looking VirusTotal link finds the same
    # numbers already on the download page, with context.
    #
    # Runs after publish and never fails the release: the binaries are already
    # out, and VirusTotal being slow is not a broken build. Release-only on
    # purpose -- doing this per push to main would burn the daily quota and
    # bury the releases that matter.
    needs: [tag, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Scan on VirusTotal and append the result to the release
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.tag.outputs.version }}
        run: |
          V="${{ needs.tag.outputs.version }}"
          # The badge follows the Windows zip (see vt_scan.py); the Linux binary
          # is scanned and listed too. The AppImage and deb wrap the same
          # binary, so scanning them would only spend quota.
          SUMMARY=$(python3 .github/scripts/vt_scan.py --badge=.github/badges/virustotal.json "cgbuy-v$V-windows.zip" "cgbuy-v$V-linux")
          # Empty means no VT_API_KEY configured; nothing to append.
          [ -n "$SUMMARY" ] || exit 0
          gh release view "$TAG" --json body --jq .body > body.md
          printf '%s\n' "$SUMMARY" >> body.md
          gh release edit "$TAG" --notes-file body.md
      - name: Commit the refreshed badge to main
        env:
          TAG: v${{ needs.tag.outputs.version }}
        run: |
          git add .github/badges/virustotal.json
          # Nothing staged means the count did not move, or there was no scan.
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "VirusTotal badge: $TAG"
          # The tag job pushed a version bump after this job's checkout.
          git pull --rebase origin main
          git push origin HEAD:main
