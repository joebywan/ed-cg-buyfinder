name: release

# Run this by hand: Actions -> release -> Run workflow, and give it a version.
# It bumps the version in the source, tags it, builds both binaries and
# publishes them as a proper (non-pre) release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 2.2 (no leading v)"
        required: true
      notes:
        description: "Extra release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Validate and check the tag is free
        id: check
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            || { echo "::error::version must look like 2.2 or 2.2.1, got '$V'"; exit 1; }
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::tag v$V already exists"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests must pass before anything is tagged
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python test_cgbuy.py

      - name: Bump VERSION in the source and tag it
        run: |
          V="${{ steps.check.outputs.version }}"
          python - "$V" <<'PY'
          import re, sys
          v = sys.argv[1]
          s = open("cgbuy").read()
          new, n = re.subn(r'^VERSION = "[^"]*"', 'VERSION = "%s"' % v, s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("could not find the VERSION line in cgbuy")
          open("cgbuy", "w").write(new)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$V"
          git tag "v$V"
          git push origin HEAD:main
          git push origin "v$V"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cgbuy-linux
            built: dist/cgbuy
          - os: windows-latest
            artifact: cgbuy-windows.exe
            built: dist/cgbuy.exe
    runs-on: ${{ matrix.os }}
    env:
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux tkinter
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
      - name: Install PyInstaller
        run: python -m pip install --quiet --upgrade pip pyinstaller
      # --windowed matches build.bat: without it the Windows build is a console
      # subsystem binary and every user gets a stray console window behind the
      # GUI. It is ignored on Linux.
      - name: Build
        shell: bash
        run: |
          python -c "import shutil; shutil.copy('cgbuy', 'build_src.py')"
          pyinstaller --onefile --name cgbuy --clean --noconfirm --windowed --distpath dist --workpath .build --specpath .build build_src.py
      - name: Sign the Windows binary
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'cgbuy-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found on this runner' }
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 '${{ matrix.built }}'
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
            & $signtool.FullName verify /pa '${{ matrix.built }}'
            if ($LASTEXITCODE -ne 0) { throw "the signature did not verify ($LASTEXITCODE)" }
          } finally {
            if (Test-Path $pfx) { Remove-Item $pfx -Force }
          }
      - name: Smoke test, and check it reports the released version
        shell: bash
        run: |
          # --windowed leaves the Windows build without a console of its own;
          # its stdout is a valid handle here only because this capture pipes it.
          OUT=$("${{ matrix.built }}" --version)
          echo "$OUT"
          echo "$OUT" | grep -q "${{ needs.tag.outputs.version }}" \
            || { echo "::error::binary reports '$OUT', expected ${{ needs.tag.outputs.version }}"; exit 1; }
      - name: Rename
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      # Composed here rather than inline so the signing line states what this
      # build actually did, instead of a claim that goes stale the day a
      # certificate is added. inputs.notes arrives via env, never interpolated
      # into the script body.
      - name: Compose the release notes
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
          SIGNED: ${{ secrets.WINDOWS_CERT_PFX_BASE64 != '' }}
        run: |
          {
            if [ -n "$NOTES" ]; then printf '%s\n' "$NOTES"; echo; fi
            echo '* `cgbuy-linux` — Linux x86-64'
            echo '* `cgbuy-windows.exe` — Windows x86-64'
            echo
            if [ "$SIGNED" = "true" ]; then
              echo 'The Windows binary is Authenticode-signed.'
            else
              echo 'Neither binary is signed; Windows SmartScreen will warn on first run.'
            fi
            echo 'Running from source works too: `python cgbuy`.'
            echo
            echo 'Some antivirus engines flag PyInstaller one-file builds generically.'
            echo 'See [Antivirus false positives](../../#antivirus-false-positives).'
          } > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          name: v${{ needs.tag.outputs.version }}
          generate_release_notes: true
          body_path: notes.md
          files: |
            cgbuy-linux
            cgbuy-windows.exe
