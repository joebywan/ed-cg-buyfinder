name: release

# Run this by hand: Actions -> release -> Run workflow, and give it a version.
# It bumps the version in the source, tags it, builds both binaries and
# publishes them as a proper (non-pre) release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 2.2 (no leading v)"
        required: true
      notes:
        description: "Extra release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Validate and check the tag is free
        id: check
        run: |
          V="${{ inputs.version }}"
          V="${V#v}"
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$' \
            || { echo "::error::version must look like 2.2 or 2.2.1, got '$V'"; exit 1; }
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::error::tag v$V already exists"; exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests must pass before anything is tagged
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-tk xvfb
          xvfb-run -a python test_cgbuy.py

      - name: Bump VERSION in the source and tag it
        run: |
          V="${{ steps.check.outputs.version }}"
          python - "$V" <<'PY'
          import re, sys
          v = sys.argv[1]
          s = open("cgbuy").read()
          new, n = re.subn(r'^VERSION = "[^"]*"', 'VERSION = "%s"' % v, s, count=1, flags=re.M)
          if n != 1:
              raise SystemExit("could not find the VERSION line in cgbuy")
          open("cgbuy", "w").write(new)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$V"
          git tag "v$V"
          git push origin HEAD:main
          git push origin "v$V"

  build:
    needs: tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: cgbuy-linux
            built: dist/cgbuy
            icon: ""
          - os: windows-latest
            artifact: cgbuy-windows.exe
            built: dist/cgbuy.exe
            icon: "icon.ico"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ needs.tag.outputs.version }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux tkinter
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-tk
      - name: Install PyInstaller
        run: python -m pip install --quiet --upgrade pip pyinstaller
      # --windowed matches build.bat: without it the Windows build is a console
      # subsystem binary and every user gets a stray console window behind the
      # GUI. It is ignored on Linux.
      - name: Build
        shell: bash
        run: |
          python -c "import shutil; shutil.copy('cgbuy', 'build_src.py')"
          # PyInstaller resolves a relative --icon against --specpath, not the
          # working directory, so hand it an absolute path.
          ICON_FLAG=""
          if [ -n "${{ matrix.icon }}" ]; then
            ICON_FLAG="--icon=$(python -c "import os,sys; print(os.path.abspath(sys.argv[1]))" "${{ matrix.icon }}")"
          fi
          pyinstaller --onefile --name cgbuy --clean --noconfirm --windowed $ICON_FLAG --distpath dist --workpath .build --specpath .build build_src.py
      - name: Smoke test, and check it reports the released version
        shell: bash
        run: |
          # --windowed leaves the Windows build without a console of its own;
          # its stdout is a valid handle here only because this capture pipes it.
          OUT=$("${{ matrix.built }}" --version)
          echo "$OUT"
          echo "$OUT" | grep -q "${{ needs.tag.outputs.version }}" \
            || { echo "::error::binary reports '$OUT', expected ${{ needs.tag.outputs.version }}"; exit 1; }
      - name: Rename
        shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish:
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.tag.outputs.version }}
          name: v${{ needs.tag.outputs.version }}
          generate_release_notes: true
          body: |
            ${{ inputs.notes }}

            * `cgbuy-linux` — Linux x86-64
            * `cgbuy-windows.exe` — Windows x86-64

            Neither binary is signed and neither will be; Windows SmartScreen
            will warn on first run. Some antivirus engines flag PyInstaller
            one-file builds generically — see
            [Antivirus false positives](../../#antivirus-false-positives),
            or run from source: `python cgbuy`.
          files: |
            cgbuy-linux
            cgbuy-windows.exe

  virustotal:
    # Scans what was actually published and appends the verdict to the release,
    # so anyone who is forwarded a scary-looking VirusTotal link finds the same
    # numbers already on the download page, with context.
    #
    # Runs after publish and never fails the release: the binaries are already
    # out, and VirusTotal being slow is not a broken build. Release-only on
    # purpose -- doing this per push to main would burn the daily quota and
    # bury the releases that matter.
    needs: [tag, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { merge-multiple: true }
      - name: Scan on VirusTotal and append the result to the release
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.tag.outputs.version }}
        run: |
          SUMMARY=$(python3 .github/scripts/vt_scan.py --badge=.github/badges/virustotal.json cgbuy-windows.exe cgbuy-linux)
          # Empty means no VT_API_KEY configured; nothing to append.
          [ -n "$SUMMARY" ] || exit 0
          gh release view "$TAG" --json body --jq .body > body.md
          printf '%s\n' "$SUMMARY" >> body.md
          gh release edit "$TAG" --notes-file body.md
      - name: Commit the refreshed badge to main
        env:
          TAG: v${{ needs.tag.outputs.version }}
        run: |
          git add .github/badges/virustotal.json
          # Nothing staged means the count did not move, or there was no scan.
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "VirusTotal badge: $TAG"
          # The tag job pushed a version bump after this job's checkout.
          git pull --rebase origin main
          git push origin HEAD:main
