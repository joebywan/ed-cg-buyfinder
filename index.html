<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cgbuy</title>
<meta name="description" content="Elite Dangerous: where to buy for a community goal, ranked by credits per minute of round trip">
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header>
  <h1>cgbuy</h1>
  <div id="dest-line" class="dest-line">Finding the community goal…</div>
  <div class="journal">
    <span id="journal-status" class="dim"></span>
    <button id="journal-btn" type="button">Connect journal folder</button>
    <input id="journal-files" type="file" webkitdirectory multiple hidden>
    <label id="eddn-label" class="check" hidden><input id="f-eddn" type="checkbox"> SHARE TO EDDN</label>
    <span id="eddn-status" class="dim"></span>
  </div>
</header>

<div id="notice" class="notice" hidden>
  <span id="notice-text"></span>
  <button id="notice-close" type="button" aria-label="Dismiss">×</button>
</div>

<form id="controls" class="controls">
  <label>HOLD <input id="f-hold" type="number" min="1" step="1" inputmode="numeric"></label>
  <label>RADIUS LY <input id="f-range" type="number" min="1" max="500" step="1"></label>
  <label>JUMP EMPTY <input id="f-jump_empty" type="number" min="1" step="0.1"></label>
  <label>JUMP LADEN <input id="f-jump_laden" type="number" min="1" step="0.1"></label>
  <label>MIN SUPPLY <input id="f-min_supply" type="number" min="1" step="1"></label>
  <label>PAD <select id="f-pad"><option>L</option><option>M</option><option>S</option></select></label>
  <label>MAX AGE D <input id="f-max_age_days" type="number" min="0" step="1"></label>
  <label class="check"><input id="f-carriers" type="checkbox"> CARRIERS</label>
  <label id="source-label" hidden>SOURCE <select id="f-source"><option value="ardent">Ardent</option><option value="spansh">Spansh</option><option value="both">Both</option></select></label>
  <label class="check" title="Include stations on a planet surface - settlements, planetary outposts and ports.&#10;&#10;Off, only orbital stations and carriers are ranked. A surface market is a different trip: a glide down, a pad on a rock, and a client that owns the expansion.&#10;&#10;Set from your journal the first time it sees a game, then it is yours. Hover a station to see which body it is on."><input id="f-odyssey" type="checkbox"> ODYSSEY</label>
  <button id="search" type="submit" class="primary">SEARCH</button>
</form>

<details id="dest-panel" class="dest-panel">
  <summary>DESTINATION</summary>
  <div class="dest-grid">
    <label>LIVE TRADE GOALS <select id="d-live"></select></label>
    <label>SYSTEM <input id="d-system" autocomplete="off"></label>
    <label>STATION <input id="d-station" autocomplete="off"></label>
    <label class="wide">COMMODITIES <input id="d-commodities" placeholder="Gold, Silver, Palladium" autocomplete="off"></label>
    <div class="dest-actions">
      <button id="d-use" type="button" class="primary">USE THIS DESTINATION</button>
      <button id="d-auto" type="button">BACK TO AUTOMATIC</button>
    </div>
    <p class="dim small">Automatic picks the goal your journal says you joined, else a live trade goal. One you set here always wins until you go back to automatic.</p>
  </div>
</details>

<nav class="tabs" role="tablist">
  <button id="tab-mixed" type="button" role="tab" aria-selected="true">BEST MIXED LOADS</button>
  <button id="tab-single" type="button" role="tab" aria-selected="false">ALL SOURCES</button>
  <div id="progress" class="progress" hidden><div id="progress-bar"></div></div>
</nav>

<main>
  <div id="wrap-mixed" class="table-wrap"><table id="t-mixed"></table></div>
  <div id="wrap-single" class="table-wrap" hidden><table id="t-single"></table></div>
  <p id="empty" class="empty" hidden></p>
  <p id="age-line" class="age-line dim"></p>
</main>

<footer>
  <div id="status" class="status"></div>
  <div id="calibration" class="dim small"></div>
  <div class="dim small">Market data from <span id="credit-src"><a href="https://ardent-insight.com" target="_blank" rel="noopener">Ardent Insight</a></span>, goals from Frontier. Click a row to copy its system.</div>
</footer>

<div id="toast" class="toast" hidden></div>
</body>
</html>
